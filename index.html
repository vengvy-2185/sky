<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sky Phone Shop · Loan Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Khmer OS Battambang';src:local('Khmer OS Battambang'),local('KhmerOSBattambang'),local('Khmer OS Battambang Regular'),url('KhmerOSbattambang.ttf') format('truetype')}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7fd;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--pri:#2563eb;--pri2:#06b6d4;--chip:#eef3fc;--ok:#059669;--sh:0 8px 28px rgba(37,99,235,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141a30;--ink:#eaf0ff;--mute:#93a0c4;--line:#252d4d;--chip:#1c2442;--sh:0 8px 28px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141a30;--ink:#eaf0ff;--mute:#93a0c4;--line:#252d4d;--chip:#1c2442;--sh:0 8px 28px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Khmer OS Battambang','Noto Sans Khmer',Inter,system-ui,sans-serif;transition:background .3s}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff}
.brand b{display:block;font:800 16px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif;letter-spacing:.5px;line-height:1.1}.brand small{color:var(--mute);font-size:11px}
.ctl{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--chip);border-radius:99px;padding:3px}
.lang button,.theme{border:0;background:none;color:var(--mute);padding:5px 11px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
.lang button.on{background:var(--pri);color:#fff}
.theme{background:var(--chip);width:38px;height:38px;padding:0;display:grid;place-items:center;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);color:var(--mute);padding:9px 2px;border-radius:14px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
h3{margin:0 0 10px;font-size:13px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.4px}
h3 svg{color:var(--pri);width:18px;height:18px}
select,input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none}
select:focus,input:focus{border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1;min-width:64px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.brands button{padding:14px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--pri);margin:12px 0 4px}
.row{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.inp{position:relative}.inp span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:600}
.warn{color:#dc2626;font-size:12px;min-height:18px;margin-top:4px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;text-align:center;box-shadow:var(--sh)}
.hero small{opacity:.9}.hero .big{font:800 40px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif}
.hero .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hero .sub div{background:rgba(255,255,255,.18);border-radius:14px;padding:10px}.hero .sub b{display:block;font:800 17px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif}
table{width:100%;border-collapse:collapse;font:13px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif}th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}.pane{display:none}.pane.on{display:block}
.disp{background:var(--bg);border-radius:16px;padding:14px;text-align:right;margin-bottom:12px;min-height:84px}
.disp .ex{color:var(--mute);font-size:14px;min-height:20px;word-break:break-all}.disp .res{font:800 34px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{padding:16px 0;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font:600 20px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif;cursor:pointer;transition:transform .05s}
.keys button:active{transform:scale(.94)}.keys .op{background:var(--pri);color:#fff}.keys .fn{color:var(--pri)}.keys .eq{background:var(--ok);color:#fff}
.conv{display:flex;align-items:center;gap:8px;margin-bottom:10px}.conv label{min-width:34px;font:800 22px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif;text-align:center;color:var(--pri)}
.out{font:800 26px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif;text-align:center;padding:12px 0;color:var(--pri);word-break:break-all}
.res2{background:var(--chip);border-radius:12px;padding:10px;margin-top:10px;font:700 17px 'Khmer OS Battambang','Noto Sans Khmer',Inter,sans-serif;text-align:center}
.note{color:var(--mute);font-size:12px;text-align:center}

.cols>div{min-width:0}
#calc .card,#fx .card,#admin .card{max-width:480px;margin-left:auto;margin-right:auto}
@media (min-width:900px){
 .wrap{max-width:1040px;padding:24px 28px 60px}
 .tabs{max-width:520px;margin-left:auto;margin-right:auto}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
 .cols>div:last-child{position:sticky;top:16px}
 .brand b{font-size:20px}
}
@media (min-width:600px) and (max-width:899px){.wrap{max-width:640px}}
@media (max-width:380px){.wrap{padding:10px 10px 30px}.hero .big{font-size:32px}.keys button{padding:13px 0;font-size:18px}.brand small{display:none}.chips button{min-width:56px;padding:9px 6px}}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}.two .btn{margin-top:0}
input.tx,textarea.tx{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none}
.g5{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g5 small{color:var(--mute);font-size:11px}.g5 input{padding:9px 4px;text-align:center}
.mh{margin:12px 0 4px;font-weight:800;color:var(--pri)}.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.mr small{display:block;color:var(--mute);font-size:12px}.act{display:flex;gap:6px;flex:none}.act button{border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
#admin .card{max-width:560px;margin-left:auto;margin-right:auto}
@media (max-width:380px){.g5{grid-template-columns:repeat(3,1fr)}}

/* ===== v3: fixed header, full-width layout, polish ===== */
:root{--pad:clamp(12px,3vw,44px);--hh:120px}
body{background-image:radial-gradient(900px 420px at 88% -120px,rgba(37,99,235,.16),transparent),radial-gradient(700px 420px at -8% 8%,rgba(6,182,212,.13),transparent);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:none;margin:0;padding:0 var(--pad) 60px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin:0 calc(-1*var(--pad)) 18px;padding:10px var(--pad);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr .top{margin-bottom:10px}.hdr .tabs{margin:0}
.tabs button{padding:7px 2px;transition:all .15s}.tabs button:hover{color:var(--pri)}.tabs button.on:hover{color:#fff}
.logo{box-shadow:0 6px 16px rgba(37,99,235,.35)}
.card{border-radius:22px;transition:box-shadow .2s}.card:hover{box-shadow:0 14px 38px rgba(37,99,235,.16)}
h3>span:first-child{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--chip);color:var(--pri)}
.hero{position:relative;overflow:hidden}.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}.hero>*{position:relative;z-index:1}
tbody tr:nth-child(even){background:var(--chip)}
.chips button:hover{border-color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
.card{break-inside:avoid}
@media (min-width:820px){
 .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
 .cols>div:first-child{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-content:start}
 .cols>div:first-child>.card:nth-child(1),.cols>div:first-child>.card:nth-child(2),.cols>div:first-child>.card:nth-child(5),.cols>div:first-child>.card:nth-child(6){grid-column:1/-1}
 .cols>div:last-child{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 16px)}
 #fx.on{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
 #fx .card:first-child{grid-column:1/-1}
 #fx .card,#admin .card{max-width:none}
 #adbody{columns:2;column-gap:20px}
 #calc .card{max-width:600px}
}
@media (min-width:900px){
 body{font-size:16px}
 .hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px var(--pad)}
 .hdr .top,.hdr .tabs{margin:0}.hdr .top{display:contents}
 .brand{order:1}.hdr .tabs{order:2;min-width:540px;max-width:none}.ctl{order:3;justify-self:end}
 .tabs button{flex-direction:row;justify-content:center;gap:8px;padding:11px 10px;font-size:14px}
 .hero .big{font-size:54px}.hero .sub b{font-size:20px}
 .keys button{padding:20px 0;font-size:22px}.disp .res{font-size:42px}
 table{font-size:14px}th,td{padding:10px 8px}
}
@media (min-width:1500px){.cols{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="hdr" class="hdr"><div class="top">
    <div class="brand"><div class="logo" data-ic="cloud"></div><div><b>SKY PHONE SHOP</b><small data-km="ម៉ាស៊ីនគិតឥណទាន" data-en="Installment calculator"></small></div></div>
    <div class="ctl">
      <button class="theme" id="th" onclick="toggleTheme()" aria-label="theme"></button>
      <div class="lang"><button id="bk" class="on" onclick="setLang('km')">ខ្មែរ</button><button id="be" onclick="setLang('en')">EN</button></div>
    </div>
  </div>
  <div class="tabs">
    <button class="on" data-t="loan" onclick="tab('loan')"><span data-ic="wallet"></span><span data-km="ឥណទាន" data-en="Loan"></span></button>
    <button data-t="calc" onclick="tab('calc')"><span data-ic="calc"></span><span data-km="គិតលេខ" data-en="Calc"></span></button>
    <button data-t="fx" onclick="tab('fx')"><span data-ic="fx"></span><span data-km="$ ↔ ៛" data-en="$ ↔ ៛"></span></button>
    <button data-t="admin" onclick="tab('admin')"><span data-ic="shield"></span><span>Admin</span></button>
  </div></div>

  <div id="loan" class="pane on"><div class="cols"><div>
    <div class="card"><h3><span data-ic="phone"></span><span data-km="ម៉ាកទូរស័ព្ទ" data-en="Brand"></span></h3><div class="chips brands" id="brand"></div></div>
    <div class="card"><h3><span data-ic="list"></span><span data-km="ជ្រើសរើសម៉ូដែល" data-en="Select model"></span></h3><select id="model"></select></div>
    <div class="card"><h3><span data-ic="sparkle"></span><span data-km="ស្ថានភាព" data-en="Condition"></span></h3><div class="chips" id="cond"></div></div>
    <div class="card"><h3><span data-ic="chip"></span><span data-km="ទំហំ Storage" data-en="Storage"></span></h3><div class="chips" id="stor"></div></div>
    <div class="card"><h3><span data-ic="cal"></span><span data-km="រយៈពេល (ខែ)" data-en="Term (months)"></span></h3><div class="chips" id="term"></div></div>
    <div class="card"><h3><span data-ic="dollar"></span><span data-km="ចំនួនទឹកប្រាក់ខ្ចី" data-en="Loan amount"></span></h3>
      <div class="row"><span data-km="តម្លៃលក់រាយ" data-en="Retail price"></span><b id="retail">—</b></div>
      <input type="range" id="rng"><div class="row"><span id="mn"></span><span id="mx"></span></div>
      <div class="inp" style="margin-top:10px"><input type="number" id="amt" inputmode="decimal" step="any"><span>$</span></div>
      <div class="warn" id="warn"></div>
    </div>
    </div><div>
    <div class="hero"><small data-km="បង់ក្នុងមួយខែ" data-en="Monthly payment"></small>
      <div class="big" id="pay">$0.00</div><small id="payk">≈ 0 ៛</small>
      <div class="sub"><div><small data-km="ប្រាក់ដើម/ខែ" data-en="Principal/mo"></small><b id="pr">$0</b></div><div><small data-km="ការប្រាក់ខែដំបូង" data-en="1st month interest"></small><b id="it">$0</b></div></div>
    </div>
    <div class="card scroll"><h3><span data-ic="list"></span><span data-km="តារាងបង់ប្រាក់" data-en="Schedule"></span></h3>
      <table><thead><tr><th>#</th><th data-km="ដើម" data-en="Principal"></th><th data-km="ការប្រាក់" data-en="Interest"></th><th data-km="សរុប" data-en="Total"></th></tr></thead><tbody id="tb"></tbody></table>
    </div>
  </div></div>
  </div>

  <div id="calc" class="pane">
    <div class="card"><div class="disp"><div class="ex" id="ex"></div><div class="res" id="rs">0</div></div><div class="keys" id="keys"></div>
    <div class="note" style="margin-top:10px" data-km="អាចវាយតាម keyboard បាន" data-en="Keyboard input supported"></div></div>
  </div>

  <div id="fx" class="pane">
    <div class="card"><h3><span data-ic="fx"></span><span data-km="អត្រាប្តូរប្រាក់ (1$ = ? ៛)" data-en="Exchange rate (1$ = ? ៛)"></span></h3><input type="number" id="rate" inputmode="decimal"></div>
    <div class="card"><h3><span data-ic="dollar"></span><span>$ → ៛</span></h3>
      <div class="conv"><label>$</label><input type="number" id="usd" placeholder="USD" inputmode="decimal"></div>
      <div class="out" id="o1">—</div>
      <div class="chips"><button onclick="setUsd(10)">$10</button><button onclick="setUsd(50)">$50</button><button onclick="setUsd(100)">$100</button><button onclick="setUsd(500)">$500</button></div></div>
    <div class="card"><h3><span data-ic="dollar"></span><span>៛ → $</span></h3>
      <div class="conv"><label>៛</label><input type="number" id="khr" placeholder="KHR" inputmode="decimal"></div>
      <div class="out" id="o2">—</div>
      <div class="chips"><button onclick="setKhr(10000)">10,000៛</button><button onclick="setKhr(50000)">50,000៛</button><button onclick="setKhr(100000)">100,000៛</button><button onclick="setKhr(1000000)">1,000,000៛</button></div></div>
  </div>

  <div id="admin" class="pane">
    <div id="adbody">
      <div class="card"><h3><span data-ic="edit"></span><span id="ftitle" data-km="បន្ថែមទូរស័ព្ទថ្មី" data-en="Add new phone"></span></h3>
        <input type="text" id="fb" list="brandlist" placeholder="Brand (iPhone, OPPO, Samsung…)" class="tx"><datalist id="brandlist"></datalist>
        <input type="text" id="fn" placeholder="Model (iPhone 17 Pro)" class="tx" style="margin-top:8px">
        <div class="row" style="margin:10px 0 6px"><span data-km="តម្លៃតាម Storage ($) — ទុកទទេបើគ្មាន" data-en="Price per storage ($) — leave blank if none"></span></div>
        <div class="g5"><div><small>64GB</small><input type="number" id="fp64" inputmode="decimal"></div><div><small>128GB</small><input type="number" id="fp128" inputmode="decimal"></div><div><small>256GB</small><input type="number" id="fp256" inputmode="decimal"></div><div><small>512GB</small><input type="number" id="fp512" inputmode="decimal"></div><div><small>1TB</small><input type="number" id="fp1024" inputmode="decimal"></div><div><small>2TB</small><input type="number" id="fp2048" inputmode="decimal"></div></div>
        <div class="warn" id="fw"></div>
        <div class="two"><button class="btn" onclick="saveM()" data-km="រក្សាទុក" data-en="Save"></button><button class="btn ghost" onclick="clearForm()" data-km="សម្អាត" data-en="Clear"></button></div></div>
      <div class="card"><h3><span data-ic="list"></span><span data-km="បញ្ជីទូរស័ព្ទ" data-en="Phone list"></span></h3><div id="mlist"></div></div>
      <div class="card"><h3><span data-ic="calc"></span><span data-km="ការកំណត់" data-en="Settings"></span></h3>
        <div class="row"><span data-km="ការប្រាក់ក្នុងមួយខែ (%)" data-en="Monthly interest (%)"></span></div><input type="number" id="srate" step="any" inputmode="decimal">
        <button class="btn" onclick="saveSet()" data-km="រក្សាទុក" data-en="Save"></button></div>
      <div class="card"><h3><span data-ic="chip"></span><span data-km="បម្រុងទុក Backup" data-en="Backup"></span></h3>
        <textarea id="bkt" rows="5" class="tx" placeholder="JSON"></textarea>
        <div class="two"><button class="btn ghost" onclick="exportDB()">Export</button><button class="btn ghost" onclick="importDB()">Import</button></div>
        <button class="btn ghost" style="margin-top:8px;color:#dc2626" onclick="resetDB()" data-km="ត្រឡប់ទៅលំនាំដើម" data-en="Reset to default"></button>
        <div class="note" style="margin-top:8px" data-km="ទិន្នន័យរក្សាទុកក្នុង browser នេះ។ ប្រើ Export/Import ដើម្បីផ្ទេរទៅឧបករណ៍ផ្សេង" data-en="Data is stored in this browser. Use Export/Import to move to another device"></div></div>
    </div>
  </div>
</div>

<script>
// ===== DEFAULT DATA (Admin tab edits are saved in this browser) =====
const S=(n,p)=>({n,p});
const DEFAULT_DB={v:2,rate:0.015,fx:4100,pin:'1234',brands:{
 iPhone:{icon:'apple',models:[S("iPhone 8",{64:80,128:90}),S("iPhone 8 Plus",{64:100,128:110}),S("iPhone SE (2020)",{64:90,128:100}),S("iPhone SE (2022)",{64:150,128:170}),S("iPhone X",{64:120,256:150}),S("iPhone XR",{64:130,128:150}),S("iPhone XS",{64:140,256:170}),S("iPhone XS Max",{64:170,256:200}),S("iPhone 11",{64:200,128:240}),S("iPhone 11 Pro",{64:240,256:290}),S("iPhone 11 Pro Max",{64:280,256:330}),S("iPhone 12 mini",{64:230,128:260}),S("iPhone 12",{64:260,128:300}),S("iPhone 12 Pro",{128:340,256:380}),S("iPhone 12 Pro Max",{128:400,256:450}),S("iPhone 13 mini",{128:320,256:370}),S("iPhone 13",{128:380,256:450}),S("iPhone 13 Pro",{128:480,256:540}),S("iPhone 13 Pro Max",{128:540,256:600}),S("iPhone 14",{128:480,256:560}),S("iPhone 14 Plus",{128:540,256:620}),S("iPhone 14 Pro",{128:620,256:700}),S("iPhone 14 Pro Max",{128:700,256:780,512:900}),S("iPhone 15",{128:600,256:680}),S("iPhone 15 Plus",{128:680,256:760}),S("iPhone 15 Pro",{128:780,256:860}),S("iPhone 15 Pro Max",{256:900,512:1050}),S("iPhone 16",{128:700,256:780}),S("iPhone 16e",{128:599,256:699,512:899}),S("iPhone 16 Plus",{128:780,256:860}),S("iPhone 16 Pro",{128:900,256:1000}),S("iPhone 16 Pro Max",{256:1100,512:1250}),S("iPhone 17e",{256:599,512:799}),S("iPhone 17",{256:820,512:1129}),S("iPhone Air",{256:1099,512:1299,1024:1699}),S("iPhone 17 Pro",{256:1100,512:1300}),S("iPhone 17 Pro Max",{256:1250,512:1450}),S("iPhone 18 Pro",{256:1199,512:1399,1024:1799,2048:2399}),S("iPhone 18 Pro Max",{256:1299,512:1499,1024:1899,2048:2499})]},
 OPPO:{icon:'phone',models:[S("OPPO A58",{128:150}),S("OPPO A78",{128:200,256:240}),S("OPPO Reno 11",{256:330}),S("OPPO Reno 12",{256:380}),S("OPPO Find X7",{256:600,512:700})]}}};
const CONDS=[["ថ្មី","New",1],["99%","99%",.92],["95%","95%",.85],["90%","90%",.78]];
const TERMS=[3,6,9,12];
let DB;try{DB=JSON.parse(localStorage.getItem('sky-db'))}catch(e){}
if(!DB||!DB.brands)DB=JSON.parse(JSON.stringify(DEFAULT_DB));
const save=()=>{try{localStorage.setItem('sky-db',JSON.stringify(DB))}catch(e){}};
if((DB.v||0)<DEFAULT_DB.v){const D=JSON.parse(JSON.stringify(DEFAULT_DB));for(const b in D.brands){const old=DB.brands[b]||{icon:D.brands[b].icon,models:[]};const out=D.brands[b].models.map(m=>old.models.find(x=>x.n==m.n)||m);old.models.forEach(x=>{if(!out.includes(x))out.push(x)});DB.brands[b]={icon:old.icon,models:out}}DB.v=D.v;save()}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// =================================================
const P={cloud:'<path d="M17.5 19a4.5 4.5 0 0 0 .4-9A6 6 0 0 0 6.3 8.6 4 4 0 0 0 7 19z"/>',wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 9H16a2 2 0 0 0 0 4h5z"/>',calc:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h.01M12 18h.01M16 18h.01"/>',pct:'<path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',fx:'<path d="M7 7h13l-3-3M17 17H4l3 3"/>',phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',apple:'<path d="M12 7c-1-2-3-3-5-2-3 1.500-3 6-1 9 1 1.500 2 3 3.500 3 1 0 1.500-.5 2.500-.5s1.500.5 2.500.5c1.500 0 2.500-1.500 3.500-3-2-1-3-4-1-6-1-1-2.500-1.500-3.500-1z"/><path d="M12 7c0-2 1-3 3-3"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',sparkle:'<path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/>',chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',dollar:'<path d="M12 2v20M17 6H9.500a3.500 3.500 0 0 0 0 7h5a3.500 3.500 0 0 1 0 7H6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/>',moon:'<path d="M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const $=id=>document.getElementById(id),f=(n,d=2)=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fxr=()=>+$('rate').value||4100;
function icons(root=document){root.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic))}
let lang='km',st={b:'iPhone',m:0,c:0,s:null,t:6,a:0};
function setTheme(t){document.documentElement.dataset.theme=t;$('th').innerHTML=ic(t=='dark'?'sun':'moon');try{localStorage.setItem('sky-theme',t)}catch(e){}}
function toggleTheme(){setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark')}
function setLang(l){lang=l;document.documentElement.lang=l;$('bk').className=l=='km'?'on':'';$('be').className=l=='en'?'on':'';
 document.querySelectorAll('[data-km]').forEach(e=>e.textContent=e.dataset[l]);buildChips();calc()}
function tab(t){window.scrollTo({top:0});document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t))}
function chips(id,items,cur,fn){$(id).innerHTML=items.map(x=>`<button class="${x.v==cur?'on':''}" onclick="${fn}('${x.v}')">${x.i?ic(x.i):''}${x.l}</button>`).join('')}
const models=()=>DB.brands[st.b].models;
function buildModels(){$('model').innerHTML=models().map((m,i)=>`<option value="${i}">${esc(m.n)}</option>`).join('');$('model').value=st.m}
function buildChips(){
 chips('brand',Object.keys(DB.brands).map(b=>({v:b,l:b,i:DB.brands[b].icon})),st.b,'pb');
 chips('cond',CONDS.map((c,i)=>({v:i,l:lang=='km'?c[0]:c[1]})),st.c,'pc');
 const sizes=Object.keys(models()[st.m].p);if(!st.s||!sizes.includes(String(st.s)))st.s=sizes[0];
 chips('stor',sizes.map(s=>({v:s,l:(+s>=1024?(+s/1024)+'TB':s+'GB')})),st.s,'ps');chips('term',TERMS.map(t=>({v:t,l:t})),st.t,'pt')}
const pb=v=>{st.b=v;st.m=0;st.s=null;st.a=0;buildModels();buildChips();calc(true)};
const pc=v=>{st.c=+v;st.a=0;buildChips();calc(true)},ps=v=>{st.s=v;st.a=0;buildChips();calc(true)},pt=v=>{st.t=+v;buildChips();calc()};
$('model').onchange=e=>{st.m=+e.target.value;st.s=null;st.a=0;buildChips();calc(true)};
const retail=()=>Math.round(models()[st.m].p[st.s]*CONDS[st.c][2]);
function calc(reset,keepInputs){
 const r=retail(),mn=Math.round(r*.3),mx=Math.round(r*.8);
 if(reset||!st.a)st.a=Math.round(r*.6);
 $('retail').textContent=f(r,0);$('rng').min=mn;$('rng').max=mx;$('rng').value=st.a;
 $('mn').textContent=(lang=='km'?'ទាបបំផុត ':'Min ')+f(mn,0);$('mx').textContent=(lang=='km'?'ខ្ពស់បំផុត ':'Max ')+f(mx,0);
 if(!keepInputs){$('amt').value=+st.a.toFixed(2)}
 $('warn').textContent=(st.a<mn||st.a>mx)?(lang=='km'?`ត្រូវនៅចន្លោះ ${f(mn,0)} – ${f(mx,0)}`:`Must be between ${f(mn,0)} – ${f(mx,0)}`):'';
 const n=st.t,pr=st.a/n;let bal=st.a,rows='',first=0;
 for(let k=1;k<=n;k++){const i=bal*DB.rate;if(k==1)first=pr+i;rows+=`<tr><td>${k}</td><td>${f(pr)}</td><td>${f(i)}</td><td><b>${f(pr+i)}</b></td></tr>`;bal-=pr}
 $('tb').innerHTML=rows;$('pay').textContent=f(first);$('payk').textContent='≈ '+Math.round(first*fxr()).toLocaleString()+' ៛';
 $('pr').textContent=f(pr);$('it').textContent=f(st.a*DB.rate)}
// typing is free; clamping happens on blur / Enter
$('rng').oninput=e=>{st.a=+e.target.value;calc()};
$('amt').oninput=e=>{st.a=+e.target.value||0;calc(false,true)};
function clamp(){const r=retail();st.a=Math.min(Math.round(r*.8),Math.max(Math.round(r*.3),st.a));calc()}
['amt'].forEach(i=>{$(i).onblur=clamp;$(i).onkeydown=e=>{if(e.key=='Enter'){clamp();e.target.blur()}}});

// calculator (buttons + physical keyboard)
const K=['AC','⌫','00','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=','$→៛'];
$('keys').innerHTML=K.map(k=>`<button class="${'÷×−+'.includes(k)?'op':k=='='?'eq':['AC','⌫','00','$→៛'].includes(k)?'fn':''}" onclick="key('${k}')">${k}</button>`).join('');
let ex='';
function ev(s){const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+\.?\d*)%/g,'($1/100)');
 if(!/^[\d+\-*/().\s]+$/.test(t))return NaN;try{return Function('"use strict";return('+t+')')()}catch(e){return NaN}}
function key(k){
 if(k=='AC')ex='';else if(k=='⌫')ex=ex.slice(0,-1);
 else if(k=='='){const v=ev(ex);if(isFinite(v))ex=String(+v.toFixed(8))}
 else if(k=='$→៛'){const v=ev(ex);if(isFinite(v))ex=String(Math.round(v*fxr()))}
 else ex+=k;
 $('ex').textContent=ex;const v=ev(ex);$('rs').textContent=isFinite(v)?(+v.toFixed(8)).toLocaleString('en-US',{maximumFractionDigits:8}):(ex?'…':'0')}
document.addEventListener('keydown',e=>{
 if(!$('calc').classList.contains('on')||/INPUT|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;
 const m={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'⌫','Escape':'AC','Delete':'AC'};
 let k=m[e.key]||e.key;
 if(/^[0-9.+]$/.test(k)||['×','÷','−','=','⌫','AC'].includes(k)){e.preventDefault();key(k)}});


// fx
const ng=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
function fx1(){const v=$('usd').value;$('o1').textContent=v?`$${ng(+v)} = ${Math.round(v*fxr()).toLocaleString()} ៛`:'—'}
function fx2(){const v=$('khr').value;$('o2').textContent=v?`${(+v).toLocaleString()} ៛ = $${ng(v/fxr())}`:'—'}
$('usd').oninput=fx1;$('khr').oninput=fx2;
$('rate').value=DB.fx;
$('rate').oninput=()=>{DB.fx=fxr();save();fx1();fx2();calc(false,true)};
function setUsd(v){$('usd').value=v;fx1()}
function setKhr(v){$('khr').value=v;fx2()}

// admin
P.shield='<path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z"/>';P.edit='<path d="M4 20h4L19 9l-4-4L4 16z"/>';P.trash='<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>';
let edit=null;const SIZES=[64,128,256,512,1024,2048],lb=s=>s>=1024?s/1024+'TB':s+'GB';
function fixSt(){if(!DB.brands[st.b])st.b=Object.keys(DB.brands)[0];if(st.m>=models().length)st.m=0;st.s=null;st.a=0}
function refresh(){save();fixSt();buildModels();buildChips();calc(true);renderAdmin();icons($('admin'))}
function renderAdmin(){
 $('brandlist').innerHTML=Object.keys(DB.brands).map(b=>`<option value="${esc(b)}">`).join('');
 $('mlist').innerHTML=Object.keys(DB.brands).map((b,bi)=>`<div class="mh">${esc(b)} · ${DB.brands[b].models.length}</div>`+DB.brands[b].models.map((m,mi)=>`<div class="mr"><div><b>${esc(m.n)}</b><small>${Object.entries(m.p).map(([z,p])=>lb(z)+' $'+p).join(' · ')}</small></div><div class="act"><button onclick="editM(${bi},${mi})">${ic('edit')}</button><button onclick="delM(${bi},${mi})">${ic('trash')}</button></div></div>`).join('')).join('');
 $('srate').value=+(DB.rate*100).toFixed(3)}
function clearForm(){edit=null;['fb','fn',...SIZES.map(z=>'fp'+z)].forEach(i=>$(i).value='');$('fw').textContent='';$('ftitle').textContent=$('ftitle').dataset[lang]}
function saveM(){
 const b=$('fb').value.trim(),n=$('fn').value.trim(),p={};SIZES.forEach(z=>{const v=+$('fp'+z).value;if(v>0)p[z]=v});
 if(!b||!n||!Object.keys(p).length){$('fw').textContent=lang=='km'?'សូមបំពេញម៉ាក ឈ្មោះ និងយ៉ាងតិច 1 តម្លៃ':'Enter brand, name and at least one price';return}
 if(edit){const ob=Object.keys(DB.brands)[edit[0]];DB.brands[ob].models.splice(edit[1],1);if(!DB.brands[ob].models.length&&ob!==b)delete DB.brands[ob]}
 if(!DB.brands[b])DB.brands[b]={icon:b.toLowerCase()=='iphone'?'apple':'phone',models:[]};
 DB.brands[b].models.push({n,p});st.b=b;st.m=DB.brands[b].models.length-1;clearForm();refresh()}
function editM(bi,mi){const b=Object.keys(DB.brands)[bi],m=DB.brands[b].models[mi];edit=[bi,mi];$('fb').value=b;$('fn').value=m.n;SIZES.forEach(z=>$('fp'+z).value=m.p[z]||'');$('ftitle').textContent=lang=='km'?'កែប្រែទូរស័ព្ទ':'Edit phone';$('fb').scrollIntoView({behavior:'smooth',block:'center'})}
function delM(bi,mi){const b=Object.keys(DB.brands)[bi];if(!confirm(lang=='km'?'លុបម៉ូដែលនេះ?':'Delete this model?'))return;DB.brands[b].models.splice(mi,1);if(!DB.brands[b].models.length)delete DB.brands[b];if(!Object.keys(DB.brands).length)DB.brands=JSON.parse(JSON.stringify(DEFAULT_DB)).brands;clearForm();refresh()}
function saveSet(){const r=+$('srate').value;if(r>0&&r<=100)DB.rate=r/100;refresh()}
function exportDB(){$('bkt').value=JSON.stringify(DB)}
function importDB(){try{const d=JSON.parse($('bkt').value);if(!d.brands||typeof d.brands!='object')throw 0;DB=d;DB.rate=DB.rate||.015;DB.fx=DB.fx||4100;$('rate').value=DB.fx;refresh()}catch(e){alert('JSON invalid')}}
function resetDB(){if(confirm(lang=='km'?'ត្រឡប់ទៅទិន្នន័យដើម?':'Reset all data?')){DB=JSON.parse(JSON.stringify(DEFAULT_DB));$('rate').value=DB.fx;clearForm();refresh()}}


function setHH(){document.documentElement.style.setProperty('--hh',$('hdr').offsetHeight+'px')}
addEventListener('resize',setHH);addEventListener('load',setHH);setHH();
icons();
let t0;try{t0=localStorage.getItem('sky-theme')}catch(e){}
setTheme(t0||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
fixSt();buildModels();setLang('km');calc(true);renderAdmin();
</script>
